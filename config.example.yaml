# config.example.yaml — placeholder shape of config.yaml (SPEC §6).
#
# Copy this to config.yaml (never committed — see .gitignore) and fill
# in real values. Secrets are NEVER literals: every field marked
# (secret) must be `keychain:<item-name>` or `env:<VAR>`.
#
# Unknown keys are validation errors, and `mcp.public.scope` has no
# default — both are deliberate (SPEC §6, D6).

paths:
  data_root: /Volumes/IMSG-Data/imsgindex   # must be on an encrypted, mounted volume (§5.4)
  live_chat_db: ~/Library/Messages/chat.db       # read-only source; the ONLY path permitted under ~/Library/Messages

database:
  dsn: postgresql://imsg@127.0.0.1:5433/imsgindex   # port must be 5433 — the dedicated instance (§1.6)
  password: keychain:imsgindex-pg                    # (secret)
  cluster_fingerprint_file: pg17/.imsgindex-cluster   # relative to data_root

sync:
  interval_seconds: 900          # >= 300
  sources:
    - name: mini
      chat_db: ~/Library/Messages/chat.db
    # A source whose chat_db is not paths.live_chat_db is merged as a seed
    # (D12): it inserts rows and fills empty values, and never replaces a
    # value the index already holds.
    # - name: studio-seed
    #   chat_db: /path/to/transferred/studio-snapshot.db

identity:
  default_region: US             # E.164 region for bare national numbers
  contacts_import: true

policy:
  index_unsent: false
  index_edit_history: false

# Model providers (SPEC §4.1) are built by imsg.providers.factory from the
# `models`, `embedding`, `retrieval`, `segmentation` and `enrichment`
# sections below. Every repo id + revision here is pinned in
# models/manifest.lock.yaml (the source of truth; `imsg models verify`
# reports drift, and checks local conversions' directories under
# data_root against their recorded digest). Real backends need the
# `models` extra:
#   uv sync --extra models
models:
  backend: real                  # real | fake. `fake` = deterministic test stand-ins, explicit
                                 # opt-in only; every command prints `models: backend=<...>` so a
                                 # fake run (meaningless search results) is never mistaken for real.
  # Memory, for the nightly window where enrichment overlaps the query server.
  share_boundary_and_caption_weights: true  # segmentation.boundary_* and enrichment.caption_* name the
                                 # same checkpoint by default; without this each loads its own copy
                                 # (measured: MLX active 18.99 -> 37.15 GiB in one process)
  query_cache_limit_bytes: 8589934592   # 8 GiB. MLX buffer-cache bound for the embedder + reranker;
                                 # MLX's own default is its memory limit (60.8 GiB on a 64 GB host)
  enrichment_cache_limit_bytes: 4294967296  # 4 GiB, same bound for the captioner/boundary/whisper
                                 # process — unbounded, one was seen holding 37.25 GiB of freed buffers

segmentation:
  session_gap_hours: 3.0
  topical_min_messages: 10
  max_messages: 50
  max_tokens: 2000
  boundary_model: mlx-community/Qwen3.5-35B-A3B-4bit          # folded into seg_config_hash (D4): changing it re-segments everything
  boundary_revision: 1e20fd8d42056f870933bf98ca6211024744f7ec  # immutable commit sha (manifest pin)
  boundary_prompt: prompts/segment_boundaries.txt             # relative to data_root

enrichment:
  egress: local_only
  window: "01:00-07:00"
  concurrency: { ocr: 4, caption: 1, transcribe: 1, pdf: 4 }
  max_attempts: 5
  video_max_frames: 20
  pdf_scanned_threshold_chars_per_page: 50
  limits:
    max_file_bytes: 1073741824
    max_pdf_pages: 1000
    max_media_seconds: 14400
    task_timeout_seconds: 1800
    temp_bytes_per_task: 10737418240
  # Model providers for S5b (defaults shown; all pinned in models/manifest.lock.yaml)
  transcription_model: mlx-community/whisper-large-v3-mlx
  transcription_revision: 49e6aa286ad60c14352c404340ded53710378a11
  transcription_language: null   # e.g. "en"; null = Whisper auto-detects per file
  caption_model: mlx-community/Qwen3.5-35B-A3B-4bit             # same weights as segmentation.boundary_model
  caption_revision: 1e20fd8d42056f870933bf98ca6211024744f7ec
  caption_prompt: prompts/caption.txt                           # relative to data_root, like boundary_prompt
  caption_max_image_side: 1920   # the model sees a copy scaled to fit this (a 12 MP photo costs ~7x at
                                 # full size); null = full resolution. OCR always reads the original.
  ocr_languages: null            # e.g. ["en-US"]; null = Apple Vision automatic language detection (macOS 13+)
  ocr_minimum_text_height: null  # Vision minimumTextHeight, fraction of image height; null = framework default
  # Enrichment stands aside for in-flight searches (never the reverse): the MCP server holds a
  # Postgres session advisory lock while it answers, and this worker pauses BETWEEN tasks while
  # it is held. A killed server releases the lock with its session, so nothing can wedge paused.
  yield_to_queries: true
  yield_poll_interval_seconds: 0.25   # only reached while a query is actually running
  yield_max_pause_seconds: 300        # then proceed anyway, so the queue still drains overnight

embedding:
  model: mlx-community/Qwen3-Embedding-8B-mxfp8
  revision: 51c773b7464b630a6c67b4f75dbd796b658d6236   # immutable commit sha (manifest pin)
  quantization: mxfp8            # informational — fixed by the artifact `model`@`revision` names
  dim: 2048                      # must match migration 0001's DDL; <= 4000 (halfvec HNSW cap)
  batch_size: 32                 # most rows per text batch (one forward pass, one transaction)
  max_batch_tokens: 2048         # most padded tokens per batch (rows x longest row); batches are length-sorted
  query_instruction: "Given a personal message search query, retrieve relevant conversation segments"
  multimodal:
    enabled: true
    provider: local               # only 'local' is implemented — D3a
    scope: full                   # only 'full' is implemented — D3a
    model: timm/PE-Core-bigG-14-448   # open_clip-layout remap of facebook/PE-Core-G14-448 (manifest pin)
    revision: 17aa0c25addfa14198fa2ff73d845a22d433432e   # immutable commit sha OF THIS REPO (manifest pin)
    dim: 1280                     # must match migration 0002's DDL
    batch_size: 16
    # The text tower alone, cut from model@revision (manifest entry
    # pe-core-g14-448-text-tower; produce it with that entry's command).
    # Query embedding loads 2.0 GiB instead of the whole model; the vectors
    # are identical. Missing directory: a warning, and the whole model loads.
    text_tower_model: models/pe-core-bigG-14-448-text-17aa0c25   # relative to data_root; null to disable

retrieval:
  k_fts: 100
  k_vector: 100
  rrf_k: 60
  # The reranker is nearly all of search latency, and it scales with the tokens it
  # reads: rerank_top candidates, each cut to rerank_doc_max_tokens (reranker tokens,
  # document only — never the query; the count includes the ~40-token segment header).
  # Never fewer than a request's `limit` are reranked. Chosen by
  # scripts/bench_retrieval_latency.py for a whole-query p95 <= 2.0 s; read the
  # README's measurements before changing.
  rerank_top: 20
  rerank_doc_max_tokens: 256     # null = no cap beyond the model's 8,192-token row
  # The reranker is pinned as a LOCAL CONVERSION (models/manifest.lock.yaml,
  # `source: local_conversion`): reranker_model is that entry's output_dir, a
  # directory relative to data_root that the lock's recorded `command`
  # produces from the upstream repo. The other accepted form is a Hugging Face
  # repo id (owner/name); the factory reads the value as a directory when
  # <data_root>/<value> exists and as a repo id otherwise. Absolute paths,
  # `~` and `..` are rejected — a directory must stay under data_root.
  # The lock also keeps the 8B conversion (qwen3-reranker-8b, status: retained —
  # verified, not active) for a quality comparison.
  reranker_model: models/qwen3-reranker-0.6b-mxfp8-e61197ed
  reranker_revision: e61197ed45024b0ed8a2d74b80b4d909f1255473   # the UPSTREAM commit the conversion was made from
                                                                # (Qwen/Qwen3-Reranker-0.6B; manifest upstream_revision).
                                                                # For a repo id: that repo's immutable commit sha.
  default_limit: 10
  # HNSW dynamic candidate list per vector search (pgvector's hnsw.ef_search,
  # range 1-1000), applied with SET LOCAL in each channel's transaction. 1000 is
  # pgvector's maximum and this build's default: measured recall@100 against exact
  # search rises from 0.94/0.79 (text/image channel) at the pgvector default of 40
  # to 1.00/1.00 at 1000, for about 50 ms more per query — small against the 2 s
  # whole-query budget the reranker dominates. See the README.
  hnsw_ef_search: 1000

render:
  timezone: America/Los_Angeles
  attachment_snippet_chars: 200

mcp:
  local:
    enabled: true
    # Load the retrieval models only on the first retrieval call. Every
    # client session starts its own server and most never search; true
    # loads at start instead (the behaviour before 2026-09-24).
    warm_at_start: false
    # Drop the retrieval models (roughly 10-15 GiB per process) after this many
    # seconds with no retrieval tool call; the next call reloads them,
    # waiting up to 90 s. Every client session runs its own server, so this
    # is what stops idle sessions from exhausting memory. 0 = never unload;
    # otherwise at least 60.
    idle_unload_seconds: 600
  public:
    enabled: false                # flip on only at Phase 6, after AT-1 passes
    bind: 127.0.0.1:8700
    external_url: https://example.invalid/mcp
    scope: allowlist               # REQUIRED — no default. 'full' or 'allowlist'; see SPEC §6, D6
    scope_approval_id: null        # required when scope: full AND enabled: true
    allowed_origins: []
    allowed_hosts: []
    protocol_versions: ["2025-11-25", "2026-07-28"]
    rate_limit_per_minute: 60
    # Off by default: a public call waits only 20 s for the models, less
    # than a reload, so the first call after an unload answers WARMING_UP.
    idle_unload_seconds: 0
    oauth:
      issuer: google
      client_id: env:IMSG_OAUTH_CLIENT_ID
      client_secret: keychain:imsgindex-oauth        # (secret)
      owner_subject: keychain:imsgindex-owner-sub     # (secret)
      tokeninfo_cache_ttl_seconds: 60

# Memory: every model load first asks whether the host has room
# (imsg.memory_admission), heavy background work stops between units when
# the host is short or paused (imsg.background_gate), and MCP servers give
# their models back under critical pressure. Defaults are measured on a
# 64 GiB host; each field's docstring in imsg.config.schema names its source.
memory:
  reserve_bytes: 8589934592         # 8 GiB left for the rest of the host after a load
  admission_max_pressure: normal    # normal | warn; nothing loads at critical, whatever this says
  admission_wait_seconds: 600       # background commands wait this long for memory, then exit 75
  admission_poll_seconds: 30
  admission_retry_seconds: 15       # an MCP server retries a refused load no sooner than this
  background_stop_at: warn          # warn | critical: workers stop after their current unit
  warn_confirm_seconds: 10          # warn must still be there this long later to stop a worker
  pressure_check_seconds: 5         # MCP watchdog's pressure reading interval
  local_server_release_at: critical # warn | critical: unload a loaded local server at once
  public_server_release_at: critical  # critical | never
  public_rewarm_cooldown_seconds: 300
  # footprints:                     # expected size of each role's model set (admission)
  #   public_server_bytes: 18468359372   # 17.2 GiB
  #   local_server_bytes: 18468359372    # 17.2 GiB
  #   embed_bytes: 26736171417           # 24.9 GiB
  #   enrich_bytes: 26628797235          # 24.8 GiB
  #   segment_bytes: 22548578304         # 21.0 GiB
  # mlx_memory_limits:              # mx.set_memory_limit per role; 0 = MLX's own default
  #   public_server_bytes: 12884901888   # 12 GiB
  #   local_server_bytes: 12884901888    # 12 GiB
  #   embed_bytes: 15032385536           # 14 GiB
  #   enrich_bytes: 33285996544          # 31 GiB
  #   segment_bytes: 25769803776         # 24 GiB

# The pause switch for heavy background work (imsg background pause|resume|status).
background:
  # Another project on this host can create this file to pause heavy
  # background work and remove it to resume; imsg only reads it. null = off.
  host_pause_file: ~/.config/imessage-index/pause-background

export:
  gcp_project: example-project-id
  gcs_bucket: example-bucket
  data_store_id: example-datastore-id
  format: txt
  batch_max_files: 100000
  # (secret) Reference to the GCP service-account key `imsg export push`
  # authenticates with; the resolved value is that key's raw JSON.
  # LEAVE IT OUT until you actually intend to push: with no credential
  # named, `imsg export push` refuses before it even loads a Google
  # client library, so nothing here can reach GCS or Discovery Engine.
  # gcp_credentials: keychain:imsgindex-gcp          # (secret)

eval:
  seed_queries: private/eval/queries.yaml   # relative to data_root
  runs_dir: eval/runs                        # relative to data_root

logging:
  level: INFO
  allow_content_debug: false
  rotate_bytes: 50000000          # rotate a data_root/logs/*.log at this size (the nightly backup does it)
  rotate_keep: 10                 # compressed generations kept per log
  retention_days: 90              # generations older than this are deleted

# The attachment fetcher (optional): where copies of attachments that are
# not on this host can be read from. `imsg locate-attachments` records
# candidate copies; `imsg backfill-attachments` tries them best first.
# attachments:
#   staging_dir: attachment-staging     # relative to data_root; pushed and pulled copies land here
#   local_location: mini                # default: the sync source that is this host's live chat.db
#   push_locations: [studio, D-XXXXX]   # copied in by `imsg push-attachments` on another host
#   pull:                               # read-only rsync over SSH from this host
#     - location: N-XXXXX
#       ssh_host: nas
#       root: /volume1/share
#   ssh_command: ssh -o BatchMode=yes
#   rsync_command: rsync
