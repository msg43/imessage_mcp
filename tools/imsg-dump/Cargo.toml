[package]
name = "imsg-dump"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Reads a macOS chat.db snapshot via the imessage-database crate and emits decoded messages as NDJSON on stdout. GPL-3.0 due to the imessage-database dependency; invoked at arm's length as a subprocess by the (MIT/Apache-2.0) imessage-index Python pipeline."
publish = false

[[bin]]
name = "imsg-dump"
path = "src/main.rs"

[dependencies]
# The whole point of this shim: links imessage-database's typedstream/attributedBody
# decoder so the Python side never has to reimplement it. GPL-3.0-or-later, hence this
# crate's own license field above and the arm's-length subprocess boundary described
# in the parent repo's CLAUDE.md.
imessage-database = "4.2.0"

# Needed directly (not just transitively via imessage-database) because main.rs calls
# chrono::Utc / DateTime methods itself when converting Apple-epoch timestamps to
# ISO-8601 UTC strings for the NDJSON contract.
chrono = "0.4"

# Needed directly because db.rs/output.rs name rusqlite::Connection/CachedStatement
# themselves (Table::get/Table::rows hand back rusqlite types), and because
# --since-rowid pagination requires a custom SQL query the crate's own public API
# doesn't expose (see db.rs doc comment). Left unpinned within 0.40.x on purpose so
# Cargo unifies it with imessage-database's exact "=0.40.0" pin rather than risking
# two incompatible rusqlite versions in the build graph.
rusqlite = "0.40"

# NDJSON output.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
