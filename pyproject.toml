[project]
name = "imsg"
version = "0.1.0"
description = "Local-first iMessage retrieval index: extraction, identity resolution, segmentation, hybrid search, and a scoped MCP surface."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "imessage-index contributors" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6",
    "typer>=0.12",
    "structlog>=24",
    "psycopg[binary]>=3.2",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
imsg = "imsg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imsg"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = ["E501"] # line length handled by formatter/line-length above; allow long strings (SQL, docstrings)

[tool.ruff.lint.isort]
known-first-party = ["imsg"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["imsg"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["phonenumbers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
