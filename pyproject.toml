[project]
name = "imsg"
version = "0.1.0"
description = "Local-first iMessage retrieval index: extraction, identity resolution, segmentation, hybrid search, and a scoped MCP surface."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "imessage-index contributors" }]
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6",
    "typer>=0.12",
    "structlog>=24",
    "psycopg[binary]>=3.2",
    "phonenumbers>=8.13",
    "apsw>=3.45",
    "pyobjc-framework-Contacts>=10",
    "mcp>=2.0.0",
    "jsonschema>=4.26.0",
    "google-cloud-storage>=2",
    "google-cloud-discoveryengine>=0.13",
    "google-auth>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-jsonschema"]
# Real model backends (`models.backend: real`, the default — see
# imsg.providers.factory). Floors are the PyPI versions verified to exist
# on 2026-09-14 (https://pypi.org/pypi/<name>/json); they mirror the
# `min_runtime` floors in models/manifest.lock.yaml, and uv.lock pins the
# exact resolved versions. Install with `uv sync --extra models`.
models = [
    "mlx>=0.32.2",                    # verified: 0.32.2 (2026-08-25); mlx-vlm 0.7.1 requires >=0.32.2
    "mlx-lm>=0.31.3",                 # verified: 0.31.3 (2026-04-22)
    "mlx-whisper>=0.4.3",             # verified: 0.4.3 (2025-08-29)
    "mlx-vlm>=0.7.1",                 # verified: 0.7.1 (2026-09-14)
    "pyobjc-framework-Vision>=12.2.2", # verified: 12.2.2 (2026-08-11)
    "pyobjc-framework-Quartz>=12.2.2", # verified: 12.2.2 (2026-08-11)
    "huggingface_hub>=1.31.0",        # verified: 1.31.0 (2026-09-10)
    "pillow>=12.3.0",                 # verified: 12.3.0 (2026-07-01)
    "torch>=2.14.0",                  # verified: 2.14.0 (2026-09-02); PE-Core (MPS) + mlx-whisper dependency
    # PE-CORE BACKEND — INTEGRATOR FILLS IN from the multimodal agent's report:
    # the package that loads facebook/PE-Core-G14-448 (imsg.embed.pe_core_multimodal).
    # Verify its floor exists on PyPI, then add the same floor to
    # models/manifest.lock.yaml `pe-core-g14-448.min_runtime`.
    # "<pe-core-backend-package>>=<version>",
]

[project.scripts]
imsg = "imsg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imsg"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = ["E501"] # line length handled by formatter/line-length above; allow long strings (SQL, docstrings)

[tool.ruff.lint.isort]
known-first-party = ["imsg"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["imsg"]
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["phonenumbers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyobjc's Contacts bridge (S3 identity resolution) ships no py.typed
# marker / stubs — same untyped-ObjC-bridge situation as every other
# pyobjc-framework-* package.
module = ["Contacts.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# google-cloud-storage ships no py.typed marker (verified 2026-07-30) —
# same untyped-third-party situation as the phonenumbers/Contacts
# overrides above (imsg.export.gcp_transport, SPEC §11.1, Phase 7 —
# real GCS+Discovery Engine export transport, unverified against the
# live API in this build).
module = ["google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true
