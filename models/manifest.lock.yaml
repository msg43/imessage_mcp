    license: apache-2.0
    expected_dim: 2048
    quantization: {mode: mxfp8, bits: 8, group_size: 32}
    artifact_sha256: null
    min_runtime: {mlx: '0.32.2', mlx-lm: '0.31.3', huggingface_hub: '1.31.0'}
    smoke_test: {status: not_run}
    notes: >-
      mlx-community's 8-bit conversion of Qwen/Qwen3-Embedding-8B (converted with
      mlx-embeddings 0.0.3, per its model card; model_type qwen3, hidden_size 4096).
      expected_dim 2048 is the MRL truncation of the model's native 4096-dim output
      (SPEC §4.1; migration 0001's halfvec(2048) CHECK constraint). Alternative
      considered: mlx-community/Qwen3-Embedding-8B-4bit-DWQ (affine 4-bit, sha
      885642d6b98742ea03b77a1673579c92ca961efd) — rejected because the spec pins 8-bit.
