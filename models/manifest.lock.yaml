    output_dir: models/qwen3-reranker-8b-mxfp8-77d193c7
    expected_dim: null
    quantization: {mode: mxfp8, bits: 8, group_size: 32}
    artifact_sha256: '29e4a1aecc6956b0ee401bbecaf058b2af75be7df3f9eb055d3fb13f014ee3d7'
    min_runtime: {mlx: '0.32.2', mlx-lm: '0.31.3', huggingface_hub: '1.31.0'}
    smoke_test:
      status: passed
      date: '2026-09-15'
      host_class: Apple M2 Ultra, 128 GB unified memory
      load_seconds: 3.71
      inference_seconds: 1.19
      peak_memory_gb: 8.09
      peak_memory_source: mlx.core.get_peak_memory
      result: 'P(yes): relevant=0.9707 > irrelevant=0.0000, both in [0, 1]'
    notes: >-
      Pinned as a LOCAL CONVERSION (owner decision 2026-09-15): mlx-lm's own 8-bit
      mxfp8 conversion (group size 32) of upstream Qwen/Qwen3-Reranker-8B at the sha
      above, written to output_dir under paths.data_root by the recorded command.
      `python` is the project venv with the `models` extra (mlx-lm 0.31.3, mlx 0.32.2,
      huggingface_hub 1.31.0); $DATA_ROOT is paths.data_root. The command fetches the
      pinned upstream snapshot first and hands its DIRECTORY to convert() rather than
      the repo id: mlx-lm 0.31.3's save() copies generation_config.json from
      `snapshot_download(repo, local_files_only=True)` — the cache's `main` ref, with
      no revision parameter — so converting by repo id would depend on refs/main
      existing and equalling the pin; from the directory every input file is the
      pinned one and the model card is generic (README.md is outside the digest
      either way). Output: 653 tensors including lm_head.weight + lm_head.scales
      (8,188,548,096 parameters, 8.44 GB), tie_word_embeddings false, config.json
      quantization {group_size: 32, bits: 8, mode: mxfp8}; conversion took 16 s on an
      M2 Ultra. Scores (query, rendered_text) pairs for SPEC §9.4 step 7; no output
      dimension applies. The reranker's P(yes) is read from lm_head logits.
      WHY NOT THE HUB CONVERSION (evidence from the 2026-09-14 smoke run, kept
      here because it is the reason this entry is a local conversion):
      mlx-community/Qwen3-Reranker-8B-mxfp8 @ a8947a5fe4c62cc1feb8dffa89d49502c8c80923
      (apache-2.0; converted with mlx-embeddings 0.0.3 per its model card) holds 651
      tensors across two safetensors shards and no lm_head.* at all — its
      model.safetensors.index.json lists an lm_head.weight and a fifth shard that do
      not exist at that revision — while upstream ships a distinct, untied
      lm_head.weight (399 tensors, tie_word_embeddings false). No loader change on
      our side can make that artifact score; mlx-lm's strict load fails first with
      "Missing 1 parameters: lm_head.weight" (recorded as smoke_test failed, host
      Apple M2 Ultra 128 GB, 2026-09-14). The same-day evaluation of this exact
      conversion recipe through the factory path gave P(yes) relevant 0.9707 vs
      irrelevant 0.0000, load 3.6 s, inference 0.69 s, peak 8.09 GiB (mlx). The
      alternative — publishing the conversion under a repo this project controls —
      was declined: the artifact is reproducible from the recorded command, and
      `imsg models verify` checks the directory's digest against artifact_sha256.
