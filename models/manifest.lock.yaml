      quantize=True, q_mode='mxfp8', q_bits=8, q_group_size=32)"` (the CLI has no
      --revision flag; mlx-lm 0.31.3's save() needs the source snapshot complete —
      snapshot_download(repo, revision=<sha>) first, or huggingface_hub 1.31 refuses).
      The output (653 tensors, lm_head.weight + lm_head.scales, 8.46 GB) loaded through
      the same factory path and passed the same check: P(yes) relevant 0.9707 vs
      irrelevant 0.0000, load 3.6 s, inference 0.69 s, peak 8.09 GiB (mlx). Not pinned:
