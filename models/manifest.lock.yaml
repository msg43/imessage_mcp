# models/manifest.lock.yaml — the model pin lock (SPEC model-manifest
# requirement): for every model, the exact repository, the immutable
# revision (commit sha), the license observed at that revision, the
# expected output dimension, the quantization, the artifact checksum,
# the minimum runtime versions, and the smoke-test result.
#
# Two kinds of entry, told apart by `source`:
#   hub (the default) — a Hugging Face repo pinned at a commit sha:
#     `repo`, `revision`, `license`.
#   local_conversion — a directory under paths.data_root produced from
#     an upstream Hub repo by a recorded, reproducible command:
#     `upstream_repo`, `upstream_revision` (sha), `upstream_license`,
#     `tool` (`<package>==<exact version>` that ran it), `command` (the
#     exact invocation; `$DATA_ROOT` stands for paths.data_root),
#     `output_dir` (data-root-relative). `repo`/`revision`/`license` stay
#     null: a local directory has no Hub revision — its provenance is the
#     upstream pin plus `artifact_sha256`, computed over the OUTPUT
#     directory. The config carries `<output_dir>` as the model and the
#     UPSTREAM sha as the revision; the provider records `model_id` as
#     `<output_dir>@<upstream sha>`.
#
# `status` says whether an entry is in use:
#   resolved — pinned and ACTIVE: it serves its `role`s and the config
#     defaults mirror it; at most one active entry per role.
#   retained — pinned and verified exactly like a resolved entry (upstream
#     drift, the directory's digest, runtime floors), but NOT ACTIVE: its
#     `role` says what it would serve and it claims nothing, so nothing
#     builds it by default. `imsg models verify` prints the active entry
#     for every role and lists retained entries separately.
#   system — ships with the OS; unresolved — no confirmed pin yet.
#
# A build MUST NOT silently advance a model or MLX package because
# "latest" changed: `imsg models verify` (scripts/verify_model_manifest.py)
# re-resolves each repo — a local conversion's upstream repo — against
# the Hugging Face API and reports drift; checks every local
# conversion's directory under data_root (`--data-root`) against its
# artifact_sha256; and checks the installed runtimes against
# `min_runtime`. It rewrites this file only with --write, and only Hub
# entries' revision/license — an upstream pin is never advanced (the
# directory on disk was converted from the pinned sha; re-convert and
# re-pin by hand). The config-schema defaults in src/imsg/constants.py
# mirror the pins below and a unit test keeps the two equal.
#
# Resolution method (2026-09-14): GET https://huggingface.co/api/models/<repo>
# -> `sha` (current main commit) and `cardData.license` / `license:*` tag;
# quantization read from each repo's config.json; runtime floors are the
# PyPI versions verified to exist on the same date (pyproject.toml
# `models` extra).
#
# Smoke runs (scripts/smoke_test_models.py, imsg.providers.model_smoke):
# every hosted entry is downloaded at its pinned sha, checksummed, built
# through imsg.providers.factory from a config carrying exactly these
# pins, and run once on a fictional input, each (entry, role) in its own
# process; `--write` then records, per entry, only these two keys:
#
#   artifact_sha256 — the hex SHA-256 of the UTF-8 text made of the lines
#     "<relative POSIX path>  <hex sha256 of the file bytes>\n" (two
#     spaces, like sha256sum), one per regular file in the pinned snapshot
#     — for a local conversion, in its output_dir — whose name matches
#     *.safetensors, *.npz, *.json, *.txt, *.model, *.tiktoken, *.jinja,
#     *.py or *.jsonl (hidden entries skipped), sorted by relative path.
#     README.md, .gitattributes and *.bin/*.pt duplicates of safetensors
#     weights are outside the definition, so a partial and a full snapshot
#     of the same commit give the same digest
#     (imsg.providers.manifest.artifact_digest is the reference
#     implementation). Null until an entry has been downloaded (or, for a
#     local conversion, converted and smoke-run); null for the system
#     entry, which has no artifact.
#   smoke_test — status (passed | failed | not_run), date, host_class
#     (chip family and memory size, never a hostname), load_seconds,
#     inference_seconds, peak_memory_gb (GiB; mlx.core.get_peak_memory for
#     the MLX runtimes, the process's max RSS for torch and Apple Vision —
#     see peak_memory_source), a one-line result, `error` when failed,
#     `macos` for the system entry (the OS version is its pin), and a
#     per-role `roles` map when one set of weights serves two roles (the
#     top-level numbers are then the per-role maxima). The numbers are
#     from the host_class named — the machine the run happened on, not
#     necessarily the deployment host.
